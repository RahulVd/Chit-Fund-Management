apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chitfund-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: chitfund.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chitfund-backend-service
                port:
                  number: 8080
